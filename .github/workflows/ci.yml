name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  frontend:
    name: React and protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:protocol
      - run: npm run typecheck
      - run: npm run build

  backend:
    name: Go backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: test -z "$(gofmt -l .)"
        working-directory: backend
      - run: go vet ./...
        working-directory: backend
      - run: go test ./...
        working-directory: backend
      - run: go build -o /tmp/tamada-backend .
        working-directory: backend
